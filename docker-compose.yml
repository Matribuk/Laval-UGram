services:
  postgres:
    image: postgres:16-alpine
    container_name: ugram-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-ugram}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ugram_password}
      POSTGRES_DB: ${DB_DATABASE:-ugram}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-ugram}']
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ugram-backend
    restart: unless-stopped
    ports:
      - '${PORT:-8080}:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-ugram}
      DB_PASSWORD: ${DB_PASSWORD:-ugram_password}
      DB_DATABASE: ${DB_DATABASE:-ugram}
      JWT_SECRET: ${JWT_SECRET:-secret}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1d}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      UPLOAD_PATH: ${UPLOAD_PATH:-./uploads}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: ugram-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-3001}:3001'
    depends_on:
      - backend

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: ugram-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ugram
      POSTGRES_PASSWORD: ugram_password
      POSTGRES_DB: ugram
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ugram']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ugram-backend
    restart: unless-stopped
    ports:
      - '8080:3000'
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder}
      CORS_ORIGIN: http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: ugram-frontend
    restart: unless-stopped
    ports:
      - '3001:3001'
    depends_on:
      - backend

volumes:
  postgres_data:

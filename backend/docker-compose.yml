services:
  postgres:
    image: postgres:16-alpine
    container_name: ugram-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-ugram}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ugram_password}
      POSTGRES_DB: ${DB_DATABASE:-ugram}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-ugram}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
